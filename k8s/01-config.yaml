# Non-secret runtime configuration. Flux-managed (see k8s/flux-deploy/kustomization.yaml) -
# kustomize-controller's ClusterRole (studylife repo's k8s/flux/06-reconciler-rbac.yaml)
# grants "configmaps" but deliberately NOT "secrets" - see k8s/02-secret.yaml for why
# ALEXA_SKILL_ID lives there instead, even though it isn't secret material in the usual
# sense.
apiVersion: v1
kind: ConfigMap
metadata:
  name: studylife-alexa-config
  namespace: studylife-alexa
data:
  # Never disable this in a deployed environment - see config.py's own comment. Kept here
  # (not just relying on Settings' own default) so it's explicit and visible in the deploy
  # manifest itself, not just implicit.
  ALEXA_VERIFY_REQUESTS: "true"
