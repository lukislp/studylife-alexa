# Selects the "newest" tag by SemVer - this repo's own .releaserc.json pushes plain SemVer
# tags without a "v" prefix via semantic-release, which Flux's standard SemVer policy parses
# directly. Deliberately unrestricted (>=0.0.0), not >=1.0.0 - the skill is intentionally kept
# pre-1.0 until it's reliable (see the v0.1.0 seed tag/release), and Flux should still deploy
# those 0.x releases as they come.
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: studylife-alexa
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: studylife-alexa
  policy:
    semver:
      range: ">=0.0.0"
