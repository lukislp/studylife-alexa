# The service itself. Image tag is a placeholder overwritten by Flux's
# ImageUpdateAutomation (k8s/flux/04-image-update-automation.yaml) the moment it first
# reconciles against a real published tag - mirrors every other StudyAtrium add-on's own
# k8s/04-app.yaml. This repo's Dockerfile creates "appuser" with an explicit numeric
# --uid 1000, so runAsNonRoot/runAsUser is safe here without live inspection.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: studylife-alexa-data
  namespace: studylife-alexa
spec:
  accessModes: ["ReadWriteOnce"]
  # Longhorn (cross-node-replicated, homelab-infra/cluster/11-longhorn-values.yaml)
  # instead of local-path - oauth.db (every issued access/refresh token, encrypted, and
  # the underlying StudyAtrium API key) survives a node dying instead of needing a Velero
  # restore.
  storageClassName: longhorn
  resources:
    requests: {storage: 128Mi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: studylife-alexa
  namespace: studylife-alexa
spec:
  replicas: 1
  strategy:
    # Single instance with an RWO volume - oauth.db is a plain SQLite file, not built
    # for concurrent writers, same reasoning as every other StudyAtrium add-on's own
    # SQLite-backed service.
    type: Recreate
  selector:
    matchLabels: {app: studylife-alexa}
  template:
    metadata:
      labels: {app: studylife-alexa}
      annotations:
        # Opt-in to homelab-infra's nightly Velero PVC backup: /app/data holds every
        # linked user's encrypted StudyAtrium API key. Losing it means re-linking the
        # account in the Alexa app.
        backup.velero.io/backup-volumes: data
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        # Makes the PVC mount group-writable by UID 1000 on first mount - without this,
        # a freshly-provisioned PersistentVolume is root-owned and the non-root
        # container gets "Permission denied" writing to /app/data/oauth.db.
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: studylife-alexa
          image: ghcr.io/lukislp/studylife-alexa:0.13.6 # set by the deploy-bump job (CI) on every release
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
            # oauth.db on the PVC below is the only thing this service persists; the image
            # layer is never written to. /tmp still has to be writable - that is where
            # Python's tempfile module and the outbound HTTP client put scratch files.
            readOnlyRootFilesystem: true
          envFrom:
            - configMapRef: {name: studylife-alexa-config}
            - secretRef: {name: studylife-alexa-secrets}
          # HTTPS listener for the StudyAtrium -> studylife-alexa purge hop (src/studylife_alexa/tls.py)
          # on 8443, with the cert-manager certificate from 06-tls-certificate.yaml. StudyAtrium's
          # AddonPurge__Alexa__BaseUrl calls this port and validates the certificate against its internal
          # CA. Removing the two variables is the explicit opt-out back to plain HTTP only.
          env:
            - name: STUDYLIFE_ALEXA_TLS_CERT_FILE
              value: /etc/studylife-alexa-tls/tls.crt
            - name: STUDYLIFE_ALEXA_TLS_KEY_FILE
              value: /etc/studylife-alexa-tls/tls.key
          ports:
            - containerPort: 8000
            # STUDYLIFE_ALEXA_TLS_PORT default (config.py): HTTPS for the same app. 8000 stays for
            # the kubelet probes, the Funnel and Prometheus.
            - containerPort: 8443
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 250m, memory: 128Mi}
          # Both probes set timeoutSeconds explicitly. The Kubernetes default of 1s is too
          # tight for the arm64 Raspberry Pi nodes this runs on: the weakest node sits close
          # to its memory limit, so an ordinary load spike pushes /healthz past one second,
          # the liveness probe fails failureThreshold times in a row and kubelet restarts a
          # container that was only busy.
          readinessProbe:
            httpGet: {path: /healthz, port: 8000}
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /healthz, port: 8000}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: tmp
              mountPath: /tmp
            - name: tls
              mountPath: /etc/studylife-alexa-tls
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: studylife-alexa-data}
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
        # Written by cert-manager (06-tls-certificate.yaml). A Secret volume follows renewals, and
        # tls.py reloads the files without a restart.
        - name: tls
          secret: {secretName: studylife-alexa-tls}
---
apiVersion: v1
kind: Service
metadata:
  name: studylife-alexa
  namespace: studylife-alexa
spec:
  type: ClusterIP
  selector: {app: studylife-alexa}
  ports:
    - name: http
      port: 8000
      targetPort: 8000
    # HTTPS for the StudyAtrium -> studylife-alexa purge hop (tls.py, 06-tls-certificate.yaml).
    # StudyAtrium's AddonPurge__Alexa__BaseUrl points here.
    - name: https
      port: 8443
      targetPort: 8443
