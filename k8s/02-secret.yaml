# IMPORTANT: all values below are placeholders - this repo is public, real values must
# never be committed. Fill in directly with kubectl, never via git.
#
# ALEXA_SKILL_ID isn't cryptographically secret (Amazon sends it in plaintext on every
# request anyway - see main.py's own skill-ID check), and ALEXA_PUBLIC_URL/
# ALEXA_REDIRECT_URIS aren't either (a browser is redirected through both in the open) -
# they're kept out of this public repo's searchable history the same way studylife-mcp
# treats its own MCP_PUBLIC_URL, not because leaking them is a real security incident.
# No StudyLife instance URL lives here at all (multi-tenant - see oauth_provider.py's
# instance-selection form): every user, including whoever deploys this, always types
# their own instance URL fresh during account linking, nothing pre-filled.
#
# ALEXA_CLIENT_ID/ALEXA_CLIENT_SECRET genuinely are secret: they're what authenticates
# Alexa's backend to this server's own /token endpoint. Generate with
# `python -c "import secrets; print(secrets.token_urlsafe(32))"` and enter the same
# values into the Alexa Developer Console's Account Linking config.
#
# ALEXA_TOKEN_ENCRYPTION_KEY encrypts every linked user's StudyLife API key at rest in
# the OAuth store - generate with `python -c "from cryptography.fernet import Fernet;
# print(Fernet.generate_key().decode())"`. Losing/rotating this makes every already-
# issued token unreadable, forcing every linked user to re-link.
#
# Bootstrap-only, NOT Flux-managed - kustomize-controller's ClusterRole (studylife
# repo's k8s/flux/06-reconciler-rbac.yaml) grants no permission on the "secrets"
# resource at all. Applied once by hand (kubectl apply -f k8s/02-secret.yaml).
apiVersion: v1
kind: Secret
metadata:
  name: studylife-alexa-secrets
  namespace: studylife-alexa
type: Opaque
stringData:
  ALEXA_SKILL_ID: "REPLACE-ME"
  ALEXA_PUBLIC_URL: "REPLACE-ME"
  ALEXA_CLIENT_ID: "REPLACE-ME"
  ALEXA_CLIENT_SECRET: "REPLACE-ME"
  ALEXA_REDIRECT_URIS: "REPLACE-ME"
  ALEXA_TOKEN_ENCRYPTION_KEY: "REPLACE-ME"
