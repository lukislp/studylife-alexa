# IMPORTANT: placeholder below - this repo is public, real values must never be committed.
# ALEXA_SKILL_ID isn't cryptographically secret (Amazon sends it in plaintext on every
# request anyway, in context.System.application.applicationId - see main.py's own skill-ID
# check), but it's this deployment's specific identity, kept out of a public repo's
# searchable history the same way studylife-mcp's MCP_PUBLIC_URL is - fill it in directly
# with kubectl, never via git. Get the real value from the Alexa Developer Console's
# Endpoint tab.
#
# Bootstrap-only, NOT Flux-managed - kustomize-controller's ClusterRole (studylife repo's
# k8s/flux/06-reconciler-rbac.yaml) grants no permission on the "secrets" resource at all.
# Applied once by hand (kubectl apply -f k8s/02-secret.yaml).
apiVersion: v1
kind: Secret
metadata:
  name: studylife-alexa-secrets
  namespace: studylife-alexa
type: Opaque
stringData:
  ALEXA_SKILL_ID: "REPLACE-ME"
